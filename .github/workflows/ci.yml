name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        python: ["3.9", "3.12"]
        exclude:
          # 最新的 Ubuntu 镜像已不提供停止维护的 Python 3.9；macOS 自带 3.9，仍在 macOS 上测
          - os: ubuntu-latest
            python: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: |
          restore-ai-tabs --version
          restore-ai-tabs --list
          restore-ai-tabs --print-hook powershell
